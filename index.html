<!DOCTYPE html>

<html lang="uk">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1">

<title>QVEN TTS PRO</title>

<style>

*{box-sizing:border-box}

body{margin:0;background:#10111a;color:white;font-family:Arial;padding:18px}

.container{max-width:620px;margin:28px auto;background:#1c1e2b;padding:22px;border-radius:20px}

h1{text-align:center;color:#a99aff}

p{text-align:center;color:#aaa}

label{display:block;margin:14px 0 7px}

textarea,select{width:100%;background:#10111a;color:white;border:1px solid #45465b;border-radius:11px;padding:13px;font-size:16px}

textarea{height:170px}

button,.download{display:block;width:100%;padding:14px;margin-top:12px;border:0;border-radius:11px;background:#8065ff;color:white;font-size:16px;font-weight:bold;text-align:center;text-decoration:none}

button.secondary{background:#34364a}

button:disabled{opacity:.55}

audio{width:100%;margin-top:16px}

#status{text-align:center;color:#c9c2ff;margin-top:14px}

</style>

</head>

<body>

<div class="container">

<h1>QVEN TTS PRO</h1>

<p>AI Text to Speech · MP3</p>

<label>Текст для озвучення</label>

<textarea id="text" maxlength="1000" placeholder="Введи текст англійською..."></textarea>

<label>Голос</label>

<select id="voice">

<option value="en-US-JennyNeural">Жіночий</option>

<option value="en-US-GuyNeural">Чоловічий</option>

</select>

<label>Швидкість: <span id="rateLabel">0%</span></label>

<input id="rate" type="range" min="-50" max="50" step="5" value="0" style="width:100%">

<button id="generate">Створити MP3</button>

<div id="status"></div>

<audio id="player" controls hidden></audio>

<a id="download" class="download" hidden>⬇ Завантажити MP3</a>

<button class="secondary" id="clear">Очистити</button>

</div>

<script>

const WORKER_URL="https://qven-tts-server.barboskin0224.workers.dev/";

const $=id=>document.getElementById(id);

let audioUrl=null;

$("rate").addEventListener("input",()=>{

 const n=Number($("rate").value);

 $("rateLabel").textContent=(n>0?"+":"")+n+"%";

});

$("generate").addEventListener("click",async()=>{

 const text=$("text").value.trim();

 if(!text){$("status").textContent="Спочатку введи текст.";return}

 $("generate").disabled=true;

 $("status").textContent="Генерую аудіо...";

 $("player").hidden=true;

 $("download").hidden=true;

 if(audioUrl)URL.revokeObjectURL(audioUrl);

 try{

  const n=Number($("rate").value);

  const response=await fetch(WORKER_URL,{

   method:"POST",

   headers:{"Content-Type":"application/json"},

   body:JSON.stringify({

    text,

    voice:$("voice").value,

    rate:(n>=0?"+":"")+n+"%",

    pitch:"+0Hz"

   })

  });

  if(!response.ok)throw new Error(await response.text());

  const blob=await response.blob();

  if(!blob.size)throw new Error("Порожній аудіофайл");

  audioUrl=URL.createObjectURL(blob);

  $("player").src=audioUrl;

  $("player").hidden=false;

  $("download").href=audioUrl;

  $("download").download="qven-tts.mp3";

  $("download").hidden=false;

  $("status").textContent="Готово! Можеш слухати або завантажити MP3.";

 }catch(e){

  $("status").textContent="Помилка: "+e.message;

 }finally{

  $("generate").disabled=false;

 }

});

$("clear").addEventListener("click",()=>{

 $("text").value="";

 $("status").textContent="";

 $("player").pause();

 $("player").hidden=true;

 $("download").hidden=true;

 if(audioUrl)URL.revokeObjectURL(audioUrl);

 audioUrl=null;

});

</script>

</body>

</html>
